<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Track Record — Onside Data</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders:wght@600;700;800&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --bg:#0B1410; --panel:#14231C; --panel-light:#1B2E23; --chalk:#F4F1E8; --chalk-dim:#A9B5AC; --turf:#3CA35A; --amber:#E8A33D; --line:rgba(244,241,232,0.14); --radius:6px; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--chalk); font-family:'Inter',sans-serif; line-height:1.6; -webkit-font-smoothing:antialiased; }
  .display { font-family:'Big Shoulders',sans-serif; font-weight:800; text-transform:uppercase; }
  .mono { font-family:'IBM Plex Mono',monospace; }
  a { color:inherit; }
  .wrap { max-width:900px; margin:0 auto; padding:0 24px; }

  nav { position:sticky; top:0; z-index:50; background:rgba(11,20,16,0.9); backdrop-filter:blur(8px); border-bottom:1px solid var(--line); }
  .nav-inner { display:flex; align-items:center; justify-content:space-between; padding:18px 24px; max-width:1120px; margin:0 auto; }
  .logo { font-family:'Big Shoulders',sans-serif; font-weight:800; font-size:22px; text-transform:uppercase; display:flex; align-items:center; gap:10px; }
  .back-link { font-size:14px; color:var(--chalk-dim); text-decoration:none; }

  .page-head { padding:56px 24px 32px; text-align:center; border-bottom:1px solid var(--line); }
  .page-head h1 { font-size:clamp(30px,6vw,48px); margin-bottom:14px; }
  .page-head p { color:var(--chalk-dim); max-width:560px; margin:0 auto; font-size:15px; }

  .summary-bar { display:flex; justify-content:center; gap:1px; background:var(--line); max-width:600px; margin:36px auto 0; border-radius:var(--radius); overflow:hidden; }
  .summary-cell { background:var(--panel-light); padding:22px; flex:1; text-align:center; }
  .summary-cell .num { font-family:'IBM Plex Mono'; font-size:30px; font-weight:600; }
  .summary-cell .label { font-size:11px; color:var(--chalk-dim); text-transform:uppercase; letter-spacing:0.05em; margin-top:6px; }

  .record-list { padding:48px 24px 80px; display:flex; flex-direction:column; gap:1px; background:var(--line); border-radius:var(--radius); overflow:hidden; }
  .record-row { background:var(--panel-light); padding:18px 22px; display:grid; grid-template-columns:1fr auto auto; align-items:center; gap:16px; }
  .record-row .teams { font-size:15px; font-weight:500; }
  .record-row .comp { font-family:'IBM Plex Mono'; font-size:11px; color:var(--chalk-dim); text-transform:uppercase; display:block; margin-bottom:3px; }
  .record-row .pick { font-family:'IBM Plex Mono'; font-size:12px; color:var(--chalk-dim); }
  .result-tag { font-family:'IBM Plex Mono'; font-size:11px; text-transform:uppercase; padding:5px 12px; border-radius:999px; white-space:nowrap; }
  .result-tag.correct { color:var(--turf); background:rgba(60,163,90,0.12); border:1px solid rgba(60,163,90,0.3); }
  .result-tag.incorrect { color:#e86a5c; background:rgba(232,106,92,0.1); border:1px solid rgba(232,106,92,0.3); }
  .result-tag.pending { color:var(--chalk-dim); background:rgba(244,241,232,0.06); border:1px solid var(--line); }
  @media (max-width:640px) { .record-row { grid-template-columns:1fr; } }

  .state-msg { text-align:center; padding:60px 24px; color:var(--chalk-dim); }
  footer { text-align:center; padding:60px 24px; border-top:1px solid var(--line); }
  .foot-logo { font-family:'Big Shoulders'; font-weight:800; text-transform:uppercase; color:var(--chalk-dim); font-size:14px; letter-spacing:0.06em; }
</style>
</head>
<body>

<nav>
  <div class="nav-inner">
    <div class="logo">
      <svg width="24" height="24" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" style="flex-shrink:0;">
        <defs><pattern id="navchecker" width="16" height="16" patternUnits="userSpaceOnUse">
          <rect width="16" height="16" fill="#F5C518"/><rect width="8" height="8" fill="#E8622A"/><rect x="8" y="8" width="8" height="8" fill="#E8622A"/>
        </pattern></defs>
        <rect x="52" y="24" width="7" height="82" rx="2" fill="#F4F1E8"/>
        <rect x="48" y="88" width="15" height="20" rx="3" fill="#1B2E23"/>
        <polygon points="59,26 102,17 97,52 59,50" fill="url(#navchecker)" stroke="#0B1410" stroke-width="1" stroke-linejoin="round"/>
      </svg>
      Onside Data
    </div>
    <a href="index.html" class="back-link">&larr; Home</a>
  </div>
</nav>

<div class="page-head">
  <h1 class="display">Track Record</h1>
  <p>Every prediction we've published, tracked openly against what actually happened. We'd rather show you the misses than pretend we don't have any — that's the whole point of publishing this page.</p>
</div>

<div class="wrap">
  <div id="summary" class="summary-bar"></div>
  <div id="record-list" class="record-list"><div class="state-msg">Loading track record…</div></div>
</div>

<footer><div class="foot-logo">Onside Data</div></footer>

<script>
  async function loadTrackRecord() {
    const summaryEl = document.getElementById('summary');
    const listEl = document.getElementById('record-list');

    try {
      const res = await fetch('data/predictions.json', { cache: 'no-store' });
      const data = res.ok ? await res.json() : { predictions: [] };
      const predictions = data.predictions || [];

      const graded = predictions.filter((p) => p.graded);
      const correct = graded.filter((p) => p.correct);
      const accuracy = graded.length > 0 ? Math.round((correct.length / graded.length) * 100) : null;

      summaryEl.innerHTML = `
        <div class="summary-cell"><div class="num">${accuracy !== null ? accuracy + '%' : '—'}</div><div class="label">Accuracy</div></div>
        <div class="summary-cell"><div class="num">${correct.length}</div><div class="label">Correct</div></div>
        <div class="summary-cell"><div class="num">${graded.length - correct.length}</div><div class="label">Incorrect</div></div>
        <div class="summary-cell"><div class="num">${predictions.length - graded.length}</div><div class="label">Pending</div></div>
      `;

      if (predictions.length === 0) {
        listEl.innerHTML = `<div class="state-msg" style="background:var(--panel-light);">No predictions published yet — check back once matchweek coverage begins.</div>`;
        return;
      }

      listEl.innerHTML = predictions.slice().reverse().map((p) => {
        const tagClass = !p.graded ? 'pending' : (p.correct ? 'correct' : 'incorrect');
        const tagText = !p.graded ? 'Pending' : (p.correct ? 'Correct' : 'Incorrect');
        return `
          <div class="record-row">
            <div>
              <span class="comp">${p.competition} · ${p.date}</span>
              <span class="teams">${p.homeTeam} vs ${p.awayTeam}</span>
            </div>
            <span class="pick">${p.keyPlayer || ''}</span>
            <span class="result-tag ${tagClass}">${tagText}</span>
          </div>
        `;
      }).join('');
    } catch (err) {
      listEl.innerHTML = `<div class="state-msg">Live data not connected yet.</div>`;
      console.error('Track record fetch error:', err);
    }
  }

  loadTrackRecord();
</script>

</body>
</html>
