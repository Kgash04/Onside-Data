<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Account — Onside Data</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders:wght@600;700;800&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root { --bg:#0B1410; --panel:#14231C; --panel-light:#1B2E23; --chalk:#F4F1E8; --chalk-dim:#A9B5AC; --turf:#3CA35A; --turf-dim:#2A7A42; --amber:#E8A33D; --line:rgba(244,241,232,0.14); --radius:6px; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--chalk); font-family:'Inter',sans-serif; line-height:1.6; -webkit-font-smoothing:antialiased; }
  .display { font-family:'Big Shoulders',sans-serif; font-weight:800; text-transform:uppercase; }
  .mono { font-family:'IBM Plex Mono',monospace; }
  a { color:inherit; }

  nav { position:sticky; top:0; z-index:50; background:rgba(11,20,16,0.9); backdrop-filter:blur(8px); border-bottom:1px solid var(--line); }
  .nav-inner { display:flex; align-items:center; justify-content:space-between; padding:18px 24px; max-width:1120px; margin:0 auto; }
  .logo { font-family:'Big Shoulders',sans-serif; font-weight:800; font-size:22px; text-transform:uppercase; display:flex; align-items:center; gap:10px; }
  .back-link { font-size:14px; color:var(--chalk-dim); text-decoration:none; }

  .wrap { max-width:420px; margin:0 auto; padding:60px 24px 100px; }
  h1 { font-size:clamp(28px,6vw,40px); text-align:center; margin-bottom:8px; }
  .sub { text-align:center; color:var(--chalk-dim); font-size:14px; margin-bottom:36px; }

  .tabs { display:flex; gap:1px; background:var(--line); border-radius:var(--radius); overflow:hidden; margin-bottom:28px; }
  .tab { flex:1; text-align:center; padding:12px; background:var(--panel); font-family:'IBM Plex Mono'; font-size:13px; text-transform:uppercase; letter-spacing:0.04em; cursor:pointer; border:none; color:var(--chalk-dim); }
  .tab.active { background:var(--panel-light); color:var(--turf); }

  form { display:flex; flex-direction:column; gap:14px; }
  label { font-family:'IBM Plex Mono'; font-size:11px; text-transform:uppercase; letter-spacing:0.05em; color:var(--chalk-dim); margin-bottom:4px; display:block; }
  input { width:100%; background:var(--panel-light); border:1px solid var(--line); color:var(--chalk); padding:12px 14px; border-radius:var(--radius); font-family:'Inter'; font-size:14px; }
  input:focus { outline:none; border-color:var(--turf); }
  button.submit { background:var(--turf); color:#06140A; border:none; padding:13px; border-radius:var(--radius); font-weight:600; font-size:14.5px; cursor:pointer; margin-top:8px; }
  button.submit:hover { background:#46bd68; }
  button.submit:disabled { opacity:0.6; cursor:not-allowed; }

  .msg { font-size:13.5px; padding:12px 14px; border-radius:var(--radius); margin-bottom:16px; display:none; }
  .msg.show { display:block; }
  .msg.error { background:rgba(232,106,92,0.1); border:1px solid rgba(232,106,92,0.3); color:#e86a5c; }
  .msg.success { background:rgba(60,163,90,0.1); border:1px solid rgba(60,163,90,0.3); color:var(--turf); }

  .account-box { background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:28px; text-align:center; }
  .account-box .email { font-family:'IBM Plex Mono'; font-size:14px; margin-bottom:20px; word-break:break-all; }
  button.signout { background:none; border:1px solid var(--line); color:var(--chalk); padding:11px 22px; border-radius:var(--radius); cursor:pointer; font-size:14px; }
  button.signout:hover { border-color:var(--chalk-dim); }

  .hidden { display:none; }
</style>
</head>
<body>

<nav>
  <div class="nav-inner">
    <div class="logo">
      <svg width="24" height="24" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" style="flex-shrink:0;">
        <defs><pattern id="navchecker" width="16" height="16" patternUnits="userSpaceOnUse">
          <rect width="16" height="16" fill="#F5C518"/><rect width="8" height="8" fill="#E8622A"/><rect x="8" y="8" width="8" height="8" fill="#E8622A"/>
        </pattern></defs>
        <rect x="52" y="24" width="7" height="82" rx="2" fill="#F4F1E8"/>
        <rect x="48" y="88" width="15" height="20" rx="3" fill="#1B2E23"/>
        <polygon points="59,26 102,17 97,52 59,50" fill="url(#navchecker)" stroke="#0B1410" stroke-width="1" stroke-linejoin="round"/>
      </svg>
      Onside Data
    </div>
    <a href="index.html" class="back-link">&larr; Home</a>
  </div>
</nav>

<div class="wrap">
  <div id="logged-out-view">
    <h1 class="display">Your Account</h1>
    <p class="sub">Sign up or log in to manage your Onside+ access.</p>

    <div class="tabs">
      <button class="tab active" id="tab-login">Log In</button>
      <button class="tab" id="tab-signup">Sign Up</button>
    </div>

    <div id="msg-box" class="msg"></div>

    <form id="login-form">
      <div>
        <label for="login-email">Email</label>
        <input type="email" id="login-email" required autocomplete="email">
      </div>
      <div>
        <label for="login-password">Password</label>
        <input type="password" id="login-password" required autocomplete="current-password">
      </div>
      <button type="submit" class="submit">Log In</button>
    </form>

    <form id="signup-form" class="hidden">
      <div>
        <label for="signup-email">Email</label>
        <input type="email" id="signup-email" required autocomplete="email">
      </div>
      <div>
        <label for="signup-password">Password</label>
        <input type="password" id="signup-password" required minlength="6" autocomplete="new-password">
      </div>
      <button type="submit" class="submit">Create Account</button>
    </form>
  </div>

  <div id="logged-in-view" class="hidden">
    <h1 class="display">Your Account</h1>
    <div class="account-box">
      <p style="color:var(--chalk-dim);font-size:13px;margin-bottom:6px;">Signed in as</p>
      <p class="email" id="user-email"></p>
      <button class="signout" id="signout-btn">Sign Out</button>
    </div>
  </div>
</div>

<script>
  const SUPABASE_URL = 'https://wfvazbadietwriovxzyo.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndmdmF6YmFkaWV0d3Jpb3Z4enlvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY1ODY3OTQsImV4cCI6MjEwMjE2Mjc5NH0.uG9vw9bWqr6iEMW6X43AT96iE2cNcR9AR41hICHAXg4';
  const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const loggedOutView = document.getElementById('logged-out-view');
  const loggedInView = document.getElementById('logged-in-view');
  const msgBox = document.getElementById('msg-box');

  function showMsg(text, type) {
    msgBox.textContent = text;
    msgBox.className = `msg show ${type}`;
  }
  function clearMsg() {
    msgBox.className = 'msg';
  }

  // Tab switching
  document.getElementById('tab-login').addEventListener('click', () => {
    document.getElementById('tab-login').classList.add('active');
    document.getElementById('tab-signup').classList.remove('active');
    document.getElementById('login-form').classList.remove('hidden');
    document.getElementById('signup-form').classList.add('hidden');
    clearMsg();
  });
  document.getElementById('tab-signup').addEventListener('click', () => {
    document.getElementById('tab-signup').classList.add('active');
    document.getElementById('tab-login').classList.remove('active');
    document.getElementById('signup-form').classList.remove('hidden');
    document.getElementById('login-form').classList.add('hidden');
    clearMsg();
  });

  // Sign up
  document.getElementById('signup-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    clearMsg();
    const email = document.getElementById('signup-email').value;
    const password = document.getElementById('signup-password').value;
    const btn = e.target.querySelector('button');
    btn.disabled = true;

    const { error } = await supabaseClient.auth.signUp({ email, password });
    btn.disabled = false;

    if (error) {
      showMsg(error.message, 'error');
    } else {
      showMsg('Account created! Check your email to confirm, then log in.', 'success');
    }
  });

  // Log in
  document.getElementById('login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    clearMsg();
    const email = document.getElementById('login-email').value;
    const password = document.getElementById('login-password').value;
    const btn = e.target.querySelector('button');
    btn.disabled = true;

    const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
    btn.disabled = false;

    if (error) {
      showMsg(error.message, 'error');
    } else {
      checkSession();
    }
  });

  // Sign out
  document.getElementById('signout-btn').addEventListener('click', async () => {
    await supabaseClient.auth.signOut();
    checkSession();
  });

  async function checkSession() {
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (session) {
      loggedOutView.classList.add('hidden');
      loggedInView.classList.remove('hidden');
      document.getElementById('user-email').textContent = session.user.email;
    } else {
      loggedOutView.classList.remove('hidden');
      loggedInView.classList.add('hidden');
    }
  }

  checkSession();
</script>

</body>
</html>
